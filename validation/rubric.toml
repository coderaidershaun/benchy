# Every weight, threshold and par band that benchy scores with.
# The tables in VALIDATION.md are generated from this file, and a test fails when they differ.
# The numbers are provisional until the pilot freezes version 1.0.

version = "0.1.0"
status = "provisional"

# Quality = mean_weight x mean of the three language scores + lowest_weight x the lowest of them.
[quality]
mean_weight = 0.6
lowest_weight = 0.4

# Overall = Quality x (base + efficiency_weight x Efficiency / 100).
[overall]
base = 0.85
efficiency_weight = 0.15

# Efficiency runs from 100 at best_factor x the baseline median to 0 at worst_factor x it, on a log scale.
# The pilot measures the two baselines; until then Efficiency is not computed.
[efficiency]
cost_weight = 0.5
time_weight = 0.5
best_factor = 0.25
worst_factor = 8.0

# Categories C to I of a language are multiplied by clamp((p - floor) / span, 0, 1), where p is its golden pass rate.
[correctness_scaling]
floor = 0.5
span = 0.45
categories = ["C", "D", "E", "F", "G", "H", "I"]

# A language that does not build from a clean checkout with the pristine Makefile scores 0 in these categories.
[build_gate]
categories = ["A", "B", "C", "D"]

# Comment density above density caps the named metric at factor times its points.
[comment_density]
density = 0.25
factor = 0.5
metric = "G.comment_quality"

# A headless run stops at either cap, is marked not finished, and Efficiency is scored at the cap.
[caps]
cost_usd = 100.0
wall_hours = 4.0

[judge]
model = "claude-opus-5-5"
samples = 3
scale_max = 4

[measurement]
fuzz_streams = 2000
mutants_per_language = 150
test_runs = 5
performance_runs = 5
min_workload_seconds = 5.0
max_cyclomatic = 10
max_function_lines = 60
max_nesting = 4
memory_limit_mb = 512

[[category]]
id = "A"
name = "Correctness"
points = 45

[[category.metric]]
id = "golden"
name = "Golden sessions"
points = 27
source = "measured"
measure = "Share of hidden golden sessions passed, averaged over feature groups"
scale = "linear"
full = 1.0
zero = 0.0

[[category.metric]]
id = "fuzz"
name = "Differential fuzz"
points = 14
source = "measured"
measure = "Share of seeded short streams whose output is byte-identical to the reference"
