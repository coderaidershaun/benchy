# Token prices that benchy uses to cost a run, in US dollars per million tokens.
# Provisional: first-party API prices as published on 2026-11-03. Check them against the price list
# (https://platform.claude.com/docs/en/about-claude/pricing) before the rubric is frozen, and after any price change.
# Cache writes cost 1.25 times input for 5 minutes and 2 times input for 1 hour. Cache reads differ by model.
# Thinking tokens are billed as output tokens. A model that is missing here makes the collector fail loudly.

version = "0.1.0"
status = "provisional"
currency = "USD"
per_tokens = 1000000

[[model]]
id = "claude-opus-5-5"
input = 4.0
output = 20.0
cache_read = 0.2
cache_write_5m = 5.0
cache_write_1h = 8.0

[[model]]
id = "claude-sonnet-5-5"
input = 2.0
output = 10.0
cache_read = 0.1
cache_write_5m = 2.5
cache_write_1h = 4.0

# For prompts up to 100,000 tokens. Longer prompts cost 0.50 and 2.50, which this table does not model.
[[model]]
id = "claude-haiku-5-5"
input = 0.1
output = 0.5
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.2

[[model]]
id = "claude-fable-5-2"
input = 8.0
output = 40.0
cache_read = 0.2
cache_write_5m = 10.0
cache_write_1h = 16.0

[[model]]
id = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25
cache_write_5m = 12.5
cache_write_1h = 20.0
